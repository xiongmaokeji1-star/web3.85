version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: web3security-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: web3security
      MYSQL_USER: web3user
      MYSQL_PASSWORD: web3password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample.sql
    ports:
      - "3306:3306"
    networks:
      - web3net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "web3user", "-pweb3password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: web3security-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: web3user
      DB_PASSWORD: web3password
      DB_NAME: web3security
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@web3security.io}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-Admin@123456}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/public
      - ./index.html:/app/public/index.html
    networks:
      - web3net

volumes:
  mysql_data:

networks:
  web3net:
    driver: bridge
