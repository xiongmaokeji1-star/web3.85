<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Web3 Admin</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="sidebar-logo-icon">🛡</span><span>Web3 Admin</span></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="/admin/dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span><span>Dashboard</span></a>
      <div class="sidebar-section-label">Management</div>
      <a href="/admin/reports.html" class="sidebar-link active"><span class="sidebar-link-icon">📢</span><span>Reports</span></a>
      <a href="/admin/fraud-db.html" class="sidebar-link"><span class="sidebar-link-icon">🗂</span><span>Fraud Database</span></a>
      <a href="/admin/users.html"   class="sidebar-link"><span class="sidebar-link-icon">👥</span><span>Users</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;" onclick="logout()">
        <span class="sidebar-link-icon">🚪</span><span>Sign Out</span>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="admin-topbar-title">Report Management</span>
      </div>
      <div class="admin-topbar-right">
        <div class="admin-user-badge"><span>👤</span><span id="admin-email">—</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-toolbar">
        <select class="form-control" style="max-width:160px;" id="filter-status" onchange="loadReports(1)">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="verified">Verified</option>
          <option value="rejected">Rejected</option>
          <option value="resolved">Resolved</option>
        </select>
        <select class="form-control" style="max-width:140px;" id="filter-type" onchange="loadReports(1)">
          <option value="">All Types</option>
          <option value="url">URL</option>
          <option value="wallet">Wallet</option>
          <option value="phone">Phone</option>
          <option value="email">Email</option>
          <option value="contract">Contract</option>
          <option value="token">Token</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Value</th>
              <th>Description</th>
              <th>Status</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reports-tbody">
            <tr><td colspan="6" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="reports-pagination"></div>
    </div>
  </div>
</div>

<!-- Status update modal -->
<div class="modal-backdrop" id="status-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Update Report Status</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Report ID</label>
      <input type="text" class="form-control" id="modal-rep-id" readonly />
    </div>
    <div class="form-group">
      <label class="form-label">New Status</label>
      <select class="form-control" id="modal-status">
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStatus()">Save</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/i18n.js"></script>
<script src="/js/main.js"></script>
<script>
  requireAuth();
  let currentPage = 1;
  const PAGE_SIZE = 20;

  function requireAuth() {
    const token = localStorage.getItem('w3s_admin_token');
    if (!token) { window.location.href = '/admin/login.html'; return; }
    const user = JSON.parse(localStorage.getItem('w3s_admin_user') || '{}');
    document.getElementById('admin-email').textContent = user.email || '—';
  }

  function logout() {
    localStorage.removeItem('w3s_admin_token');
    localStorage.removeItem('w3s_admin_user');
    window.location.href = '/admin/login.html';
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  function getAuthHeaders() {
    return { 'Authorization': 'Bearer ' + localStorage.getItem('w3s_admin_token') };
  }

  async function apiAuthGet(endpoint, params = {}) {
    const qs  = new URLSearchParams(params).toString();
    const url = '/api' + endpoint + (qs ? '?' + qs : '');
    const res = await fetch(url, { headers: getAuthHeaders() });
    return res.json();
  }

  async function apiAuthPut(endpoint, data) {
    const res = await fetch('/api' + endpoint, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify(data)
    });
    return res.json();
  }

  const STATUS_BADGE = {
    pending:  '<span class="badge badge-medium">⏳ Pending</span>',
    verified: '<span class="badge badge-safe">✅ Verified</span>',
    rejected: '<span class="badge badge-unknown">❌ Rejected</span>',
    resolved: '<span class="badge badge-safe">✔ Resolved</span>'
  };

  async function loadReports(page = 1) {
    currentPage = page;
    const status = document.getElementById('filter-status').value;
    const type   = document.getElementById('filter-type').value;
    const tbody  = document.getElementById('reports-tbody');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>';

    const params = { page, limit: PAGE_SIZE };
    if (status) params.status = status;
    if (type)   params.type   = type;

    try {
      const res = await apiAuthGet('/reports', params);
      if (!res.success || !res.data.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted);">No reports found</td></tr>';
        renderPagination(0, page);
        return;
      }
      tbody.innerHTML = res.data.map(r => `
        <tr>
          <td>${W3S.escHtml(r.type)}</td>
          <td style="font-family:monospace;font-size:0.82rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${W3S.escHtml(r.value)}">${W3S.escHtml(r.value)}</td>
          <td style="max-width:200px;white-space:normal;font-size:0.82rem;">${W3S.escHtml((r.description || '').substring(0, 80))}${(r.description || '').length > 80 ? '…' : ''}</td>
          <td>${STATUS_BADGE[r.status] || r.status}</td>
          <td style="white-space:nowrap;">${W3S.fmtDate(r.created_at)}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="openModal('${r.id}', '${r.status}')">Update</button>
          </td>
        </tr>
      `).join('');
      renderPagination(res.total, page);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--red);">Error: ${W3S.escHtml(err.message)}</td></tr>`;
    }
  }

  function renderPagination(total, page) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el    = document.getElementById('reports-pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    if (page > 1) html += `<button class="page-btn" onclick="loadReports(${page - 1})">‹</button>`;
    for (let i = Math.max(1, page - 2); i <= Math.min(pages, page + 2); i++) {
      html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadReports(${i})">${i}</button>`;
    }
    if (page < pages) html += `<button class="page-btn" onclick="loadReports(${page + 1})">›</button>`;
    el.innerHTML = html;
  }

  function openModal(id, currentStatus) {
    document.getElementById('modal-rep-id').value    = id;
    document.getElementById('modal-status').value    = currentStatus;
    document.getElementById('status-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('status-modal').classList.remove('open');
  }

  async function saveStatus() {
    const id     = document.getElementById('modal-rep-id').value;
    const status = document.getElementById('modal-status').value;
    try {
      const res = await apiAuthPut(`/reports/${id}/status`, { status });
      if (res.success) {
        W3S.showToast('Status updated', 'success');
        closeModal();
        loadReports(currentPage);
      } else {
        W3S.showToast(res.message || 'Update failed', 'error');
      }
    } catch (err) {
      W3S.showToast('Error: ' + err.message, 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', () => loadReports(1));
</script>
</body>
</html>
