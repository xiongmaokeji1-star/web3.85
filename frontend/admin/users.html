<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management — Web3 Admin</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="sidebar-logo-icon">🛡</span><span>Web3 Admin</span></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="/admin/dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span><span>Dashboard</span></a>
      <div class="sidebar-section-label">Management</div>
      <a href="/admin/reports.html"  class="sidebar-link"><span class="sidebar-link-icon">📢</span><span>Reports</span></a>
      <a href="/admin/fraud-db.html" class="sidebar-link"><span class="sidebar-link-icon">🗂</span><span>Fraud Database</span></a>
      <a href="/admin/users.html"    class="sidebar-link active"><span class="sidebar-link-icon">👥</span><span>Users</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;" onclick="logout()">
        <span class="sidebar-link-icon">🚪</span><span>Sign Out</span>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="admin-topbar-title" data-i18n="admin.users">User Management</span>
      </div>
      <div class="admin-topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ New User</button>
        <div class="admin-user-badge"><span>👤</span><span id="admin-email">—</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Created</th>
              <th>Last Login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="5" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="users-pagination"></div>
    </div>
  </div>
</div>

<!-- Create user modal -->
<div class="modal-backdrop" id="create-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Create New User</h3>
      <button class="modal-close" onclick="closeCreateModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Email *</label>
      <input type="email" class="form-control" id="new-email" placeholder="user@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password *</label>
      <input type="password" class="form-control" id="new-password" placeholder="Min 8 characters" />
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <select class="form-control" id="new-role">
        <option value="moderator">Moderator</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createUser()">Create</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Delete User</h3>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <p style="color:var(--text2);">Are you sure you want to delete this user? This cannot be undone.</p>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/i18n.js"></script>
<script src="/js/main.js"></script>
<script>
  requireAuth();
  let currentPage = 1, deleteUserId = null;
  const PAGE_SIZE = 20;

  function requireAuth() {
    if (!localStorage.getItem('w3s_admin_token')) { window.location.href = '/admin/login.html'; return; }
    const user = JSON.parse(localStorage.getItem('w3s_admin_user') || '{}');
    document.getElementById('admin-email').textContent = user.email || '—';
  }

  function logout() {
    localStorage.removeItem('w3s_admin_token'); localStorage.removeItem('w3s_admin_user');
    window.location.href = '/admin/login.html';
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  function getAuthHeaders() { return { 'Authorization': 'Bearer ' + localStorage.getItem('w3s_admin_token') }; }

  async function apiAuthGet(ep, params = {}) {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch('/api' + ep + (qs ? '?' + qs : ''), { headers: getAuthHeaders() });
    return res.json();
  }

  async function apiAuthReq(ep, method, data) {
    const res = await fetch('/api' + ep, {
      method,
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: data ? JSON.stringify(data) : undefined
    });
    return res.json();
  }

  async function loadUsers(page = 1) {
    currentPage = page;
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>';

    try {
      const res = await apiAuthGet('/admin/users', { page, limit: PAGE_SIZE });
      if (!res.success || !res.data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--muted);">No users found</td></tr>';
        renderPagination(0, page); return;
      }
      tbody.innerHTML = res.data.map(u => `
        <tr>
          <td>${W3S.escHtml(u.email)}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-danger' : 'badge-unknown'}">${W3S.escHtml(u.role)}</span></td>
          <td>${W3S.fmtDate(u.created_at)}</td>
          <td>${W3S.fmtDate(u.last_login) || '—'}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${u.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
      renderPagination(res.total, page);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--red);">Error: ${W3S.escHtml(err.message)}</td></tr>`;
    }
  }

  function renderPagination(total, page) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el    = document.getElementById('users-pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    if (page > 1) html += `<button class="page-btn" onclick="loadUsers(${page-1})">‹</button>`;
    for (let i=Math.max(1,page-2); i<=Math.min(pages,page+2); i++) {
      html += `<button class="page-btn ${i===page?'active':''}" onclick="loadUsers(${i})">${i}</button>`;
    }
    if (page < pages) html += `<button class="page-btn" onclick="loadUsers(${page+1})">›</button>`;
    el.innerHTML = html;
  }

  function openCreateModal() { document.getElementById('create-modal').classList.add('open'); }
  function closeCreateModal() { document.getElementById('create-modal').classList.remove('open'); }

  async function createUser() {
    const email    = document.getElementById('new-email').value.trim();
    const password = document.getElementById('new-password').value;
    const role     = document.getElementById('new-role').value;
    if (!email || !password) { W3S.showToast('Email and password required', 'error'); return; }
    if (password.length < 8) { W3S.showToast('Password must be at least 8 characters', 'error'); return; }

    try {
      const res = await apiAuthReq('/auth/register', 'POST', { email, password, role });
      if (res.success) {
        W3S.showToast('User created', 'success');
        closeCreateModal();
        loadUsers(1);
      } else {
        W3S.showToast(res.message || 'Creation failed', 'error');
      }
    } catch (err) {
      W3S.showToast('Error: ' + err.message, 'error');
    }
  }

  function openDeleteModal(id) {
    deleteUserId = id;
    document.getElementById('delete-modal').classList.add('open');
  }

  function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); deleteUserId = null; }

  async function confirmDelete() {
    if (!deleteUserId) return;
    try {
      const res = await apiAuthReq(`/admin/users/${deleteUserId}`, 'DELETE');
      if (res.success) {
        W3S.showToast('User deleted', 'success');
        closeDeleteModal();
        loadUsers(1);
      } else {
        W3S.showToast(res.message || 'Delete failed', 'error');
      }
    } catch (err) {
      W3S.showToast('Error: ' + err.message, 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', () => loadUsers(1));
</script>
</body>
</html>
