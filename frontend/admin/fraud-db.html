<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Database — Web3 Admin</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="sidebar-logo-icon">🛡</span><span>Web3 Admin</span></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="/admin/dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span><span>Dashboard</span></a>
      <div class="sidebar-section-label">Management</div>
      <a href="/admin/reports.html"  class="sidebar-link"><span class="sidebar-link-icon">📢</span><span>Reports</span></a>
      <a href="/admin/fraud-db.html" class="sidebar-link active"><span class="sidebar-link-icon">🗂</span><span>Fraud Database</span></a>
      <a href="/admin/users.html"    class="sidebar-link"><span class="sidebar-link-icon">👥</span><span>Users</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;" onclick="logout()">
        <span class="sidebar-link-icon">🚪</span><span>Sign Out</span>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="admin-topbar-title">Fraud Database Management</span>
      </div>
      <div class="admin-topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Entry</button>
        <div class="admin-user-badge"><span>👤</span><span id="admin-email">—</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-toolbar">
        <input type="text" class="form-control table-search" id="fdb-search" placeholder="Search entries…" oninput="debouncedLoad()" />
        <select class="form-control" style="max-width:140px;" id="fdb-type" onchange="loadEntries(1)">
          <option value="">All Types</option>
          <option value="url">URL</option>
          <option value="wallet">Wallet</option>
          <option value="phone">Phone</option>
          <option value="email">Email</option>
          <option value="contract">Contract</option>
          <option value="token">Token</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Value</th>
              <th>Severity</th>
              <th>Source</th>
              <th>Description</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="fdb-tbody">
            <tr><td colspan="7" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="fdb-pagination"></div>
    </div>
  </div>
</div>

<!-- Add / Edit modal -->
<div class="modal-backdrop" id="entry-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add Fraud Entry</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <input type="hidden" id="modal-entry-id" />
    <div class="form-group">
      <label class="form-label">Type *</label>
      <select class="form-control" id="modal-type">
        <option value="url">URL</option>
        <option value="wallet">Wallet</option>
        <option value="phone">Phone</option>
        <option value="email">Email</option>
        <option value="contract">Contract</option>
        <option value="token">Token</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Value *</label>
      <input type="text" class="form-control" id="modal-value" placeholder="e.g. phishing-site.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Severity</label>
      <select class="form-control" id="modal-severity">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Source</label>
      <input type="text" class="form-control" id="modal-source" placeholder="community / on-chain / manual" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-control" id="modal-description" rows="3" placeholder="Describe the fraud…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Confirm Delete</h3>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <p style="color:var(--text2);font-size:0.9rem;">Are you sure you want to delete this fraud entry? This action cannot be undone.</p>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/i18n.js"></script>
<script src="/js/main.js"></script>
<script>
  requireAuth();
  let currentPage = 1, deleteId = null;
  const PAGE_SIZE = 20;

  function requireAuth() {
    if (!localStorage.getItem('w3s_admin_token')) { window.location.href = '/admin/login.html'; return; }
    const user = JSON.parse(localStorage.getItem('w3s_admin_user') || '{}');
    document.getElementById('admin-email').textContent = user.email || '—';
  }

  function logout() {
    localStorage.removeItem('w3s_admin_token'); localStorage.removeItem('w3s_admin_user');
    window.location.href = '/admin/login.html';
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  function getAuthHeaders() { return { 'Authorization': 'Bearer ' + localStorage.getItem('w3s_admin_token') }; }

  async function apiAuthGet(ep, params = {}) {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch('/api' + ep + (qs ? '?' + qs : ''), { headers: getAuthHeaders() });
    return res.json();
  }

  async function apiAuthReq(ep, method, data) {
    const res = await fetch('/api' + ep, {
      method,
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: data ? JSON.stringify(data) : undefined
    });
    return res.json();
  }

  let _debounceTimer;
  function debouncedLoad() { clearTimeout(_debounceTimer); _debounceTimer = setTimeout(() => loadEntries(1), 400); }

  async function loadEntries(page = 1) {
    currentPage = page;
    const keyword = document.getElementById('fdb-search').value.trim();
    const type    = document.getElementById('fdb-type').value;
    const tbody   = document.getElementById('fdb-tbody');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>';

    const params = { page, limit: PAGE_SIZE };
    if (keyword) params.keyword = keyword;
    if (type)    params.type    = type;

    try {
      const res = await apiAuthGet('/fraud-db', params);
      if (!res.success || !res.data.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--muted);">No entries found</td></tr>';
        renderPagination(0, page); return;
      }
      tbody.innerHTML = res.data.map(e => `
        <tr>
          <td>${W3S.escHtml(e.type)}</td>
          <td style="font-family:monospace;font-size:0.82rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${W3S.escHtml(e.value)}</td>
          <td>${W3S.severityBadge(e.severity)}</td>
          <td style="font-size:0.82rem;">${W3S.escHtml(e.source || '—')}</td>
          <td style="max-width:180px;white-space:normal;font-size:0.82rem;">${W3S.escHtml((e.description || '').substring(0, 60))}${(e.description||'').length>60?'…':''}</td>
          <td style="white-space:nowrap;">${W3S.fmtDate(e.created_at)}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-outline btn-sm" onclick="openEditModal('${e.id}','${W3S.escHtml(e.type)}','${W3S.escHtml(e.value)}','${e.severity}','${W3S.escHtml(e.source||'')}','${W3S.escHtml((e.description||'').replace(/'/g,"&#39;"))}')">Edit</button>
            <button class="btn btn-danger btn-sm" style="margin-left:0.3rem;" onclick="openDeleteModal('${e.id}')">Del</button>
          </td>
        </tr>
      `).join('');
      renderPagination(res.total, page);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--red);">Error: ${W3S.escHtml(err.message)}</td></tr>`;
    }
  }

  function renderPagination(total, page) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el    = document.getElementById('fdb-pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    if (page > 1) html += `<button class="page-btn" onclick="loadEntries(${page-1})">‹</button>`;
    for (let i=Math.max(1,page-2); i<=Math.min(pages,page+2); i++) {
      html += `<button class="page-btn ${i===page?'active':''}" onclick="loadEntries(${i})">${i}</button>`;
    }
    if (page < pages) html += `<button class="page-btn" onclick="loadEntries(${page+1})">›</button>`;
    el.innerHTML = html;
  }

  function clearModalFields() {
    document.getElementById('modal-entry-id').value   = '';
    document.getElementById('modal-type').value       = 'url';
    document.getElementById('modal-value').value      = '';
    document.getElementById('modal-severity').value   = 'medium';
    document.getElementById('modal-source').value     = '';
    document.getElementById('modal-description').value= '';
  }

  function openAddModal() {
    document.getElementById('modal-title').textContent = 'Add Fraud Entry';
    clearModalFields();
    document.getElementById('entry-modal').classList.add('open');
  }

  function openEditModal(id, type, value, severity, source, description) {
    document.getElementById('modal-title').textContent       = 'Edit Fraud Entry';
    document.getElementById('modal-entry-id').value          = id;
    document.getElementById('modal-type').value              = type;
    document.getElementById('modal-value').value             = value;
    document.getElementById('modal-severity').value          = severity;
    document.getElementById('modal-source').value            = source;
    document.getElementById('modal-description').value       = description;
    document.getElementById('entry-modal').classList.add('open');
  }

  function closeModal() { document.getElementById('entry-modal').classList.remove('open'); }

  async function saveEntry() {
    const id          = document.getElementById('modal-entry-id').value;
    const type        = document.getElementById('modal-type').value;
    const value       = document.getElementById('modal-value').value.trim();
    const severity    = document.getElementById('modal-severity').value;
    const source      = document.getElementById('modal-source').value.trim();
    const description = document.getElementById('modal-description').value.trim();

    if (!value) { W3S.showToast('Value is required', 'error'); return; }

    try {
      const res = id
        ? await apiAuthReq(`/fraud-db/${id}`, 'PUT', { description, severity })
        : await apiAuthReq('/fraud-db', 'POST', { type, value, description, severity, source });
      if (res.success) {
        W3S.showToast(id ? 'Entry updated' : 'Entry created', 'success');
        closeModal();
        loadEntries(currentPage);
      } else {
        W3S.showToast(res.message || 'Save failed', 'error');
      }
    } catch (err) {
      W3S.showToast('Error: ' + err.message, 'error');
    }
  }

  function openDeleteModal(id) {
    deleteId = id;
    document.getElementById('delete-modal').classList.add('open');
  }

  function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); deleteId = null; }

  async function confirmDelete() {
    if (!deleteId) return;
    try {
      const res = await apiAuthReq(`/fraud-db/${deleteId}`, 'DELETE');
      if (res.success) {
        W3S.showToast('Entry deleted', 'success');
        closeDeleteModal();
        loadEntries(currentPage);
      } else {
        W3S.showToast(res.message || 'Delete failed', 'error');
      }
    } catch (err) {
      W3S.showToast('Error: ' + err.message, 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', () => loadEntries(1));
</script>
</body>
</html>
